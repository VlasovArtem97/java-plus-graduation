syntax = "proto3";

import "google/protobuf/timestamp.proto";
import "stats/messages/action_type.proto";

package stats.messages;

option java_multiple_files = true;
option java_package = "ru.practicum.ewm.stats.proto.messages";

message UserActionProto {
  int64 user_id = 1;
  int64 event_id = 2;
  stats.messages.ActionTypeProto action_type = 3;
  google.protobuf.Timestamp timestamp = 4;
}