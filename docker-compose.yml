# Убрал билды для docker, решил запускать через приложение (в тз об этом не говорится)
version: '3.8'

services:
  kafka:
    image: confluentinc/confluent-local:7.4.3
    hostname: kafka
    container_name: kafka
    ports:
      - "9092:9092" # for client connections
      - "9101:9101" # JMX
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      CLUSTER_ID: 'K0EA9p0yEe6MkAAAAkKsEg'

  kafka-init-topics:
    image: confluentinc/confluent-local:7.4.3
    container_name: kafka-init-topics
    depends_on:
      - kafka
    command: "bash -c \
                'kafka-topics --create --topic stats.user-actions.v1 \
                             --partitions 1 --replication-factor 1 --if-not-exists \
                             --bootstrap-server kafka:29092 && \
                kafka-topics --create --topic stats.events-similarity.v1 \
                             --partitions 1 --replication-factor 1 --if-not-exists \
                             --bootstrap-server kafka:29092'"
    init: true
  stats-db:
    image: postgres:16.1
    container_name: stats-db
    ports: [ "6543:5432" ]
    environment:
      - POSTGRES_DB=stat-server
      - POSTGRES_USER=stat
      - POSTGRES_PASSWORD=stat
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 10

  ewm-db:
    image: postgres:16.1
    container_name: ewm-db
    ports: [ "6542:5432" ]
    depends_on:
      stats-db:
        condition: service_healthy
    environment:
      - POSTGRES_DB=ewm
      - POSTGRES_USER=ewm
      - POSTGRES_PASSWORD=ewm
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 10

  core-db:
    image: postgres:16.1
    container_name: core-db
    depends_on:
      ewm-db:
        condition: service_healthy
    entrypoint:
      - bash
      - -c
      - |
        set -e
        export PGPASSWORD=ewm
        databases=("core_user_service"
                   "core_event_service"
                   "core_request_service"
                   "core_rating_service"
                   "stats_analyzer_service")
        
        for db in "$${databases[@]}"; do
         echo "Проверка на наличия базы данных: $$db"
         exists=$$(psql -h ewm-db -U ewm -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='$$db'")

         if [ "$$exists" != "1" ]; then
          echo "База данных создана: $$db"
          psql -h ewm-db -U ewm -d postgres -c "CREATE DATABASE $$db;"
         else
          echo "База данных $$db уже существует."
         fi
        done
        echo "Базы данных инициализированы"